<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2942" />
      <stop offset="60%" stop-color="#16385C" />
      <stop offset="100%" stop-color="#091A2B" />
    </linearGradient>
    <linearGradient id="ogSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="ogBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="ogShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Subtle Blueprint / Wave Grid overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Golden Warm Sun in background -->
  <circle cx="1020" cy="180" r="140" fill="url(#ogSun)" opacity="0.85" filter="url(#ogShadow)"/>
  <circle cx="1020" cy="180" r="180" fill="none" stroke="#FDE68A" stroke-width="4" stroke-dasharray="16 20" opacity="0.4"/>

  <!-- Left Content: Texts and Pills -->
  <g transform="translate(100, 140)">
    <!-- Brand Pill -->
    <rect x="0" y="0" width="280" height="38" rx="19" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="2"/>
    <text x="140" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="2">
      🌊 MDP BEACH &amp; RESORT
    </text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      Gestión Balnearia
    </text>
    <text x="0" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#F59E0B" letter-spacing="-1">
      Integral 2026/2027
    </text>

    <!-- Subtitle -->
    <text x="0" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#94A3B8">
      Mapa de Carpas &amp; Sombrillas · Pantallas KDS · Carta QR · Modo Offline
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 245)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="160" height="42" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="80" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
        🏖️ Plano en Vivo
      </text>

      <!-- Badge 2 -->
      <rect x="175" y="0" width="160" height="42" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="255" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
        🍳 Cocina KDS
      </text>

      <!-- Badge 3 -->
      <rect x="350" y="0" width="160" height="42" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="430" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
        📱 Pedidos QR
      </text>

      <!-- Badge 4 -->
      <rect x="525" y="0" width="160" height="42" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="605" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
        ⚡ 100% Offline
      </text>
    </g>

    <!-- Domain Footer -->
    <text x="0" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#38BDF8" letter-spacing="1">
      mdp-beach.grupoinfinity.site · Grupo Infinity
    </text>
  </g>

  <!-- Right Floating Beach Umbrella Graphic -->
  <g transform="translate(860, 220)" filter="url(#ogShadow)">
    <!-- Umbrella Canopy -->
    <path d="M0 160 C0 40 80 -10 180 -10 C280 -10 360 40 360 160 Z" fill="#FFFFFF"/>
    <!-- Cyan Stripe -->
    <path d="M0 160 C10 70 65 15 125 0 C75 45 40 105 35 160 Z" fill="url(#ogBlue)"/>
    <!-- Amber Stripe -->
    <path d="M180 -10 C205 25 225 90 225 160 L180 160 Z" fill="#F59E0B"/>
    <!-- Cyan Stripe Right -->
    <path d="M360 160 C350 70 295 15 235 0 C285 45 320 105 325 160 Z" fill="url(#ogBlue)"/>
    <!-- Top Pin -->
    <circle cx="180" cy="-16" r="10" fill="#F59E0B"/>
    <!-- Pole -->
    <path d="M180 160 L180 320 Q180 340 160 340" stroke="#FDE68A" stroke-width="16" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Ocean Waves at Bottom -->
  <path d="M0 550 Q150 510 300 550 T600 550 T900 550 T1200 550" fill="none" stroke="#0284C7" stroke-width="22" opacity="0.6"/>
  <path d="M0 585 Q160 545 320 585 T640 585 T960 585 T1200 585" fill="none" stroke="#38BDF8" stroke-width="18"/>
  <path d="M0 615 Q180 585 360 615 T720 615 T1080 615 T1200 615" fill="none" stroke="#BAE6FD" stroke-width="12" opacity="0.8"/>
</svg>
