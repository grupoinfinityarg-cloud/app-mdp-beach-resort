<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2942" />
      <stop offset="100%" stop-color="#031525" />
    </linearGradient>
    <linearGradient id="qrNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad3)"/>
  
  <!-- Outer Tech Circuit Ring -->
  <rect x="10" y="10" width="492" height="492" rx="110" fill="none" stroke="#0284C7" stroke-width="4" stroke-opacity="0.4"/>
  <circle cx="50" cy="50" r="6" fill="#38BDF8"/>
  <circle cx="462" cy="50" r="6" fill="#F59E0B"/>
  <circle cx="50" cy="462" r="6" fill="#38BDF8"/>
  <circle cx="462" cy="462" r="6" fill="#F59E0B"/>

  <!-- Center Hex/Diamond QR Smart Badge -->
  <rect x="146" y="146" width="220" height="220" rx="40" fill="#FFFFFF" filter="url(#shadow3)"/>
  
  <!-- QR Corner Markers -->
  <rect x="170" y="170" width="48" height="48" rx="12" fill="#0F2942"/>
  <rect x="182" y="182" width="24" height="24" rx="4" fill="#0284C7"/>

  <rect x="294" y="170" width="48" height="48" rx="12" fill="#0F2942"/>
  <rect x="306" y="182" width="24" height="24" rx="4" fill="#0284C7"/>

  <rect x="170" y="294" width="48" height="48" rx="12" fill="#0F2942"/>
  <rect x="182" y="306" width="24" height="24" rx="4" fill="#0284C7"/>

  <!-- Center Beach Umbrella Emitting from QR Core -->
  <!-- Umbrella Canopy overlapping the QR matrix -->
  <path d="M200 256 C200 210 225 185 256 185 C287 185 312 210 312 256 Z" fill="#F59E0B" filter="url(#shadow3)"/>
  <path d="M200 256 C205 220 225 200 240 190 C225 210 215 235 210 256 Z" fill="#D97706"/>
  <path d="M312 256 C307 220 287 200 272 190 C287 210 297 235 302 256 Z" fill="#D97706"/>
  <!-- Pole -->
  <line x1="256" y1="256" x2="256" y2="330" stroke="#0F2942" stroke-width="8" stroke-linecap="round"/>

  <!-- Floating Tech Data Signals / Waves radiating -->
  <path d="M100 256 C100 170 170 100 256 100" fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" stroke-dasharray="16 16"/>
  <path d="M412 256 C412 342 342 412 256 412" fill="none" stroke="#F59E0B" stroke-width="10" stroke-linecap="round" stroke-dasharray="16 16"/>

  <!-- Floating Notification Ping at Top Right -->
  <circle cx="360" cy="130" r="22" fill="#10B981" filter="url(#shadow3)"/>
  <path d="M350 130 L357 137 L372 122" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
