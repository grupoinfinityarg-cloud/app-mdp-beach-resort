<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#202428" />
      <stop offset="100%" stop-color="#14181c" />
    </linearGradient>
    <linearGradient id="marGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55C7E8" />
      <stop offset="100%" stop-color="#34a9cb" />
    </linearGradient>
  </defs>
  <!-- Background with Negro grafito rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Amarillo sol: Sun in background -->
  <circle cx="360" cy="140" r="52" fill="#FFD43B" />
  
  <!-- Umbrella in Blanco and Naranja gastronómico / Celeste mar -->
  <path d="M256 120 C180 120 120 180 110 240 L402 240 C392 180 332 120 256 120 Z" fill="#FFFFFF" />
  <!-- Umbrella stripes: Naranja gastronómico & Celeste mar -->
  <path d="M180 145 C155 170 135 200 125 240 L195 240 C195 200 190 165 180 145 Z" fill="#F47B35" />
  <path d="M332 145 C357 170 377 200 387 240 L317 240 C317 200 322 165 332 145 Z" fill="#55C7E8" />
  
  <!-- Center pole with Amarillo sol -->
  <path d="M252 230 L252 380 Q252 396 236 396" stroke="#FFD43B" stroke-width="12" stroke-linecap="round" fill="none" />
  
  <!-- Celeste mar: Sea waves -->
  <path d="M70 370 Q130 340 190 370 T310 370 T430 370" fill="none" stroke="url(#marGradient)" stroke-width="14" stroke-linecap="round" />
  <path d="M100 410 Q160 385 220 410 T340 410 T460 410" fill="none" stroke="#55C7E8" stroke-width="10" stroke-linecap="round" opacity="0.75" />
</svg>
