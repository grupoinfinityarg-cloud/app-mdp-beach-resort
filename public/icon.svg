<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2942" />
      <stop offset="50%" stop-color="#16385C" />
      <stop offset="100%" stop-color="#0A1D30" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad1)"/>
  
  <!-- Subtle Outer Border Rim -->
  <rect x="6" y="6" width="500" height="500" rx="114" fill="none" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Golden Warm Sun -->
  <circle cx="350" cy="150" r="68" fill="url(#sunGrad)" filter="url(#glow)"/>

  <!-- Sun Beams Accent -->
  <circle cx="350" cy="150" r="88" fill="none" stroke="#FDE68A" stroke-width="3" stroke-dasharray="8 12" stroke-opacity="0.5"/>

  <!-- Classic Beach Umbrella Canopy -->
  <g filter="url(#glow)">
    <!-- Main white dome base -->
    <path d="M120 250 C120 160 180 120 256 120 C332 120 392 160 392 250 Z" fill="#FFFFFF"/>
    <!-- Left Atlantic Cyan segment -->
    <path d="M120 250 C125 185 165 140 210 126 C175 160 150 205 145 250 Z" fill="url(#skyGrad)"/>
    <!-- Center-right Amber segment -->
    <path d="M256 120 C275 145 290 195 290 250 L256 250 Z" fill="#F59E0B"/>
    <!-- Right Atlantic Cyan segment -->
    <path d="M392 250 C387 185 347 140 302 126 C337 160 362 205 367 250 Z" fill="url(#skyGrad)"/>
    <!-- Top finial pin -->
    <circle cx="256" cy="116" r="8" fill="#F59E0B"/>
  </g>

  <!-- Umbrella Pole (warm gold) -->
  <path d="M256 248 L256 370 Q256 386 240 386" stroke="url(#sandGrad)" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- Ocean Waves Layer 1 (Back Deep) -->
  <path d="M60 380 Q110 350 160 380 T260 380 T360 380 T460 380" fill="none" stroke="#0284C7" stroke-width="14" stroke-linecap="round" opacity="0.6"/>

  <!-- Ocean Waves Layer 2 (Front Bright Turquoise with Foam) -->
  <path d="M50 415 Q105 385 160 415 T270 415 T380 415 T470 415" fill="none" stroke="#38BDF8" stroke-width="14" stroke-linecap="round"/>

  <!-- Ocean Waves Layer 3 (Low Sand Reflection) -->
  <path d="M90 445 Q145 425 200 445 T310 445 T420 445" fill="none" stroke="#BAE6FD" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
</svg>
