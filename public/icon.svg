  <path d="M332 145 C357 170 377 200 387 240 L317 240 C317 200 322 165 332 145 Z" fill="#059669" />
  <!-- Center pole -->
  <path d="M252 230 L252 380 Q252 396 236 396" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" fill="none" />
  
  <!-- Sea waves -->
  <path d="M70 370 Q130 340 190 370 T310 370 T430 370" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" opacity="0.85" />
  <path d="M100 410 Q160 385 220 410 T340 410 T460 410" fill="none" stroke="#6ee7b7" stroke-width="10" stroke-linecap="round" opacity="0.6" />
